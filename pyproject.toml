[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zenodo-auto-meta"
version = "0.1.0"
description = "Auto-complete metadata of Zenodo records using LLMs"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "openai>=1.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
]

[project.scripts]
zenodo-auto-meta = "zenodo_auto_meta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
